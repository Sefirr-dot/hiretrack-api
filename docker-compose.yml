services:
  app:
    build: .
    container_name: hiretrack-app
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Inside the compose network the services are reached by name, not localhost
      DB_URL: jdbc:postgresql://postgres:5432/hiretrack
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_DIR: /app/uploads
      # Real SMTP if MAIL_HOST is set in .env, otherwise the bundled Mailpit
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hiretrack-postgres
    environment:
      POSTGRES_DB: hiretrack
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d hiretrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hiretrack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local SMTP catcher: reminder emails show up at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: hiretrack-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
